# Render Blueprint for the HydroMind AI backend.
#
# Deploy: in the Render dashboard, "New" -> "Blueprint", connect this repo.
# Render reads this file and provisions the service automatically.
#
# By default this runs entirely off the JSON files in backend/data/ — no
# database needed. If you later want a real cloud database, create a
# Supabase project (see backend/supabase_setup/), add SUPABASE_URL and
# SUPABASE_KEY as env vars in the Render dashboard, and redeploy — no code
# changes required (see backend/app/data_store.py).
services:
  - type: web
    name: hydromind-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python -m ml_engine.dataset_generator &&
      python -m ml_engine.train
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        sync: false
